name: Tourism Project Pipeline

on:
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
 # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tourism.Project # 👈 Tells GitHub to run commands inside this subfolder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Register Dataset
        run: python model_building/data_register.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/tourism.csv # 👈 Adjusted path for artifact upload
      
  # ---------- JOB 2: Data Preparation ----------
  data-prep:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tourism.Project # 👈 Tells GitHub to run commands inside this subfolder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r requirements.txt
               
      - name: Run Data Preparation
        run: python model_building/prep.py
      
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Tourism.Project/Xtrain.csv
            Tourism.Project/Xtest.csv
            Tourism.Project/ytrain.csv
            Tourism.Project/ytest.csv

  # ---------- JOB 3: Model Training ----------
  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tourism.Project # 👈 Tells GitHub to run commands inside this subfolder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: Tourism.Project # 👈 Downloads them directly back into the subfolder

      - name: Start MLflow Server and Train Model
      env:
          # 🟢 Injects the tracking URI directly into the environment
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000 
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 &
          sleep 5
          python model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "casatishkaikolar"
          git config user.email "casatish.kaikolar@gmail.com"
          git add deployment/best_tourism_model_v1.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
